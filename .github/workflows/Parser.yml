name: Parser

# Controls when the action will run.
on:
  # Triggers the workflow on each push event
  push:
    branches:
      - '*' # Trigger on all branches
    tags-ignore:
      - '*' # Ignore all tags
    paths:
      - '.contrib/.db/**'
      - '.github/workflows/Parser.yml'
      - '.contrib/Source Code/Parser/**'
      - '.contrib/Source Code/TextFile.cs'
  # Triggers the workflow on each pull request event
  pull_request:
    paths:
      - '.contrib/.db/**'
      - '.github/workflows/Parser.yml'
      - '.contrib/Source Code/Parser/**'
      - '.contrib/Source Code/TextFile.cs'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .contrib/.tools

    steps:
      - uses: actions/checkout@v7

      - name: Build Parser from source
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          $output = "$env:GITHUB_WORKSPACE\.contrib\.builds\parser\"
          $intermediate = "$env:GITHUB_WORKSPACE\.contrib\.builds\parser-obj\"
          & $msbuild '.contrib/Source Code/Parser/Parser.csproj' /nologo /m /p:Configuration=Release /p:Platform=x64 /p:OutputType=Exe "/p:OutputPath=$output" "/p:BaseIntermediateOutputPath=$intermediate" "/p:IntermediateOutputPath=$intermediate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ATT_PARSER=${output}Parser.exe" >> $env:GITHUB_ENV

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            non_forever:
              - '.contrib/.db/**'
              - '!.contrib/.db/forever/**'
              - '.github/workflows/Parser.yml'
              - '.contrib/Source Code/Parser/**'
              - '.contrib/Source Code/TextFile.cs'

      - parallel:
        - name: Database Parser for Retail
          id: Parse-Retail
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config"

        - name: Database Parser for Classic Era
          id: Parse-ClassicEra
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/01 - Classic Era.config"

        - name: Database Parser for Season of Discovery
          id: Parse-ClassicSoD
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/01 - Classic SOD.config"

        - name: Database Parser for The Burning Crusade
          id: Parse-TBC
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/02 - TBC.config"

        - name: Database Parser for Wrath of the Lich King
          id: Parse-WOTLK
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/03 - Wrath.config"

        - name: Database Parser for Cataclysm
          id: Parse-CATA
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/04 - Cataclysm.config"

        - name: Database Parser for Mists of Pandaria
          id: Parse-MOP
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/05 - Mists of Pandaria.config"

        - name: Database Parser for Forever
          id: Parse-FOREVER
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "%ATT_PARSER%" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/forever/.config/forever.config"

      - name: Full Success Check
        shell: pwsh
        run: |
          $results = [ordered]@{
            FOREVER = '${{ steps.Parse-FOREVER.outcome }}'
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -or '${{ steps.changes.outputs.non_forever }}' -eq 'true') {
            $results = [ordered]@{
              Retail = '${{ steps.Parse-Retail.outcome }}'
              ClassicEra = '${{ steps.Parse-ClassicEra.outcome }}'
              ClassicSoD = '${{ steps.Parse-ClassicSoD.outcome }}'
              TBC = '${{ steps.Parse-TBC.outcome }}'
              WOTLK = '${{ steps.Parse-WOTLK.outcome }}'
              CATA = '${{ steps.Parse-CATA.outcome }}'
              MOP = '${{ steps.Parse-MOP.outcome }}'
              FOREVER = '${{ steps.Parse-FOREVER.outcome }}'
            }
          }

          Write-Host "Verify all Versions Parsed Successfully..."
          foreach ($result in $results.GetEnumerator()) {
            Write-Host "$($result.Key): $($result.Value)"
          }

          if (@($results.Values | Where-Object { $_ -ne 'success' }).Count -eq 0) {
            Write-Host "✅ All Versions Parsed Successfully"
          } else {
            Write-Host "❌ One or more Parsed Versions Errored"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: db  # Artifact name
          path: db/  # File path to upload
          retention-days: 7
