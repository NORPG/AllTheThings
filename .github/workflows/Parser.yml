name: Parser

# Controls when the action will run.
on:
  # Triggers the workflow on each push event
  push:
    branches:
      - '**' # Trigger on all branches, including names containing '/'
    tags-ignore:
      - '*' # Ignore all tags
    paths:
      - '.contrib/.db/**'
      - '.contrib/src/Parser/**'
      - '.contrib/.tools/**'
      - '**/*.lua'
      - '**/*.xml'
      - '**/*.toc'
      - '.pkgmeta'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/Parser.yml'
      - '.github/workflows/Release.yml'
  # Triggers the workflow on each pull request event
  pull_request:
    paths:
      - '.contrib/.db/**'
      - '.contrib/src/Parser/**'
      - '.contrib/.tools/**'
      - '**/*.lua'
      - '**/*.xml'
      - '**/*.toc'
      - '.pkgmeta'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/Parser.yml'
      - '.github/workflows/Release.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .contrib/.tools

    steps:
      - uses: actions/checkout@v7

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            non_forever:
              - '.contrib/.db/**'
              - '!.contrib/.db/forever/**'
              - '.contrib/src/Parser/**'
              - '.contrib/.tools/**'
              - '**/*.lua'
              - '**/*.xml'
              - '**/*.toc'
              - '.pkgmeta'
              - '.github/scripts/**'
              - 'tests/**'
              - '.github/workflows/Parser.yml'
              - '.github/workflows/Release.yml'
            parser_source:
              - '.contrib/src/Parser/**'

      - name: Build changed Parser sources
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.parser_source == 'true'
        shell: pwsh
        run: |
          nuget restore ../src/Parser/packages.config -PackagesDirectory ../src/Parser/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msbuild = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          & $msbuild ../src/Parser/Parser.csproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - parallel:
        - name: Database Parser for Retail
          id: Parse-Retail
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config"

        - name: Database Parser for Classic Era
          id: Parse-ClassicEra
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/01 - Classic Era.config"

        - name: Database Parser for Season of Discovery
          id: Parse-ClassicSoD
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/01 - Classic SOD.config"

        - name: Database Parser for The Burning Crusade
          id: Parse-TBC
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/02 - TBC.config"

        - name: Database Parser for Wrath of the Lich King
          id: Parse-WOTLK
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/03 - Wrath.config"

        - name: Database Parser for Cataclysm
          id: Parse-CATA
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/04 - Cataclysm.config"

        - name: Database Parser for Mists of Pandaria
          id: Parse-MOP
          if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.non_forever == 'true'
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/standard/.config/classic/05 - Mists of Pandaria.config"

        - name: Database Parser for Forever
          id: Parse-FOREVER
          timeout-minutes: 5
          continue-on-error: true
          shell: cmd
          run: |
            "Parser.exe" auto baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/forever/.config/forever.config"

      - name: Full Success Check
        shell: pwsh
        run: |
          $results = [ordered]@{
            FOREVER = '${{ steps.Parse-FOREVER.outcome }}'
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -or '${{ steps.changes.outputs.non_forever }}' -eq 'true') {
            $results = [ordered]@{
              Retail = '${{ steps.Parse-Retail.outcome }}'
              ClassicEra = '${{ steps.Parse-ClassicEra.outcome }}'
              ClassicSoD = '${{ steps.Parse-ClassicSoD.outcome }}'
              TBC = '${{ steps.Parse-TBC.outcome }}'
              WOTLK = '${{ steps.Parse-WOTLK.outcome }}'
              CATA = '${{ steps.Parse-CATA.outcome }}'
              MOP = '${{ steps.Parse-MOP.outcome }}'
              FOREVER = '${{ steps.Parse-FOREVER.outcome }}'
            }
          }

          Write-Host "Verify all Versions Parsed Successfully..."
          foreach ($result in $results.GetEnumerator()) {
            Write-Host "$($result.Key): $($result.Value)"
          }

          if (@($results.Values | Where-Object { $_ -ne 'success' }).Count -eq 0) {
            Write-Host "✅ All Versions Parsed Successfully"
          } else {
            Write-Host "❌ One or more Parsed Versions Errored"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: db  # Artifact name
          path: db/  # File path to upload
          retention-days: 7

  validate-package:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 300

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: db
          path: db

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test package validation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package without publishing
        uses: BigWigsMods/packager@457c47679b7b454dcf7ca44127c647116bc31dd8
        with:
          args: -d

      - name: Validate final ZIPs
        run: python3 .github/scripts/validate-package.py .release/*.zip
