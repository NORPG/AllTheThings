name: Parser with New CD

on:
  push:
    branches: ["forever-beta"]
    tags-ignore: ["*"]
  pull_request:
    branches: ["forever-beta"]
    paths:
      - ".contrib/.db/**"
      - ".contrib/db-sync/**"
      - ".github/workflows/Parser_with_new_CD.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full trusted source commit SHA to rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect-commits:
    runs-on: ubuntu-latest
    outputs:
      has_commits: ${{ steps.commits.outputs.has_commits }}
      matrix: ${{ steps.commits.outputs.matrix }}
      publish: ${{ steps.commits.outputs.publish }}
    steps:
      - name: Checkout pinned trusted scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: trusted-tools
          fetch-depth: 0
          persist-credentials: false
      - name: Collect exact commits using runner PowerShell
        id: commits
        shell: pwsh
        env:
          TOOLS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_COMMITS: ${{ toJSON(github.event.commits) }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          & "$env:GITHUB_WORKSPACE/trusted-tools/.contrib/db-sync/new-cd.ps1" `
            -Command collect -ToolsSource "$env:GITHUB_WORKSPACE/trusted-tools"

  build:
    needs: collect-commits
    if: needs.collect-commits.outputs.has_commits == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.collect-commits.outputs.matrix) }}
    steps:
      - name: Checkout pinned trusted scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: trusted-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact selected source separately
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          path: exact-source
          fetch-depth: 1
          persist-credentials: false
      - name: Generate eight fresh products and schema 2 triple
        id: package
        timeout-minutes: 45
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          TOOLS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          SOURCE_REF: ${{ matrix.source_ref }}
          PUBLISH: ${{ matrix.publish }}
          RETENTION_DAYS: ${{ matrix.retention_days }}
        run: |
          & "$env:GITHUB_WORKSPACE/trusted-tools/.contrib/db-sync/new-cd.ps1" `
            -Command build -ToolsSource "$env:GITHUB_WORKSPACE/trusted-tools" `
            -Source "$env:GITHUB_WORKSPACE/exact-source" `
            -Stage "$env:RUNNER_TEMP/att-stage-$env:EXPECTED_SHA" `
            -OutputDirectory "$env:RUNNER_TEMP/att-bundle-$env:EXPECTED_SHA" `
            -ExpectedSha $env:EXPECTED_SHA -ToolsSha $env:TOOLS_SHA `
            -SourceRef $env:SOURCE_REF -RetentionDays $env:RETENTION_DAYS -Publish $env:PUBLISH
      - name: Upload successful complete triple
        uses: actions/upload-artifact@v7
        with:
          name: db-bundle-${{ steps.package.outputs.key }}
          path: ${{ steps.package.outputs.bundle }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [collect-commits, build]
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.repository == 'ATTWoWAddon/AllTheThings' &&
      needs.collect-commits.result == 'success' &&
      needs.collect-commits.outputs.publish == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: db-release-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout trusted publication scripts only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Download successful bundles
        uses: actions/download-artifact@v8
        with:
          pattern: db-bundle-*
          path: bundles
      - name: Preflight all triples and publish without replacement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TOOLS_SHA: ${{ github.workflow_sha }}
          MATRIX_JSON: ${{ needs.collect-commits.outputs.matrix }}
        run: |
          . "$env:GITHUB_WORKSPACE/trusted-tools/.contrib/db-sync/att-deploy.ps1" -LibraryOnly
          $matrix = ConvertFrom-AttJson $env:MATRIX_JSON
          $expected = [string[]]@($matrix['include'] | ForEach-Object { $_['sha'] })
          & "$env:GITHUB_WORKSPACE/trusted-tools/.contrib/db-sync/new-cd.ps1" `
            -Command publish -ToolsSource "$env:GITHUB_WORKSPACE/trusted-tools" `
            -Bundles "$env:GITHUB_WORKSPACE/bundles" `
            -ExpectedCommitsJson (ConvertTo-Json -InputObject $expected -Compress) `
            -ToolsSha $env:TOOLS_SHA -Repository $env:REPOSITORY -TargetSha $env:TOOLS_SHA
